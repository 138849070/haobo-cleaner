org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official

# Gradle 8.x moves extracted AARs into an "immutable workspace" via rename().
# Some Windows security suites (HONOR PCManager, etc.) hook that call and make
# it fail with "Could not move temporary workspace ... to immutable location".
# Disabling the feature keeps the build working without turning off the AV.
systemProp.org.gradle.internal.engine.disable.immutable.workspaces=true
